version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: teamsync-postgres

    restart: always

    environment:
      POSTGRES_DB: teamsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend

    container_name: teamsync-web

    restart: always

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles

    depends_on:
      - postgres

  nginx:
    image: nginx:latest

    container_name: teamsync-nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro

    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
